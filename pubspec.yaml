name: gops
description: Application locale de gestion personnelle d'interventions.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_edge_ai: ^2.6.0
  flutter_edge_ai_litertlm: ^1.20.0
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  image_picker: ^1.2.4
  image: ^4.10.1
  path_provider: ^2.1.5
  path: ^1.9.1
  cryptography: ^2.7.0
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_email_sender: ^11.2.0
  intl: ^0.20.3
  file_picker: 13.3.3
  share_plus: 13.3.1
  archive: 4.7.1
  qr_flutter: 4.1.0
  mobile_scanner: 7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gops_logo.png
    - assets/fonts/Rubik-Regular.ttf
    - assets/fonts/Rubik-Medium.ttf
    - assets/fonts/OFL.txt
