name: gops
description: Application locale de gestion personnelle d'interventions.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  image_picker: ^1.2.4
  image: ^4.10.1
  path_provider: ^2.1.5
  path: ^1.9.1
  cryptography: ^2.7.0
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_email_sender: ^11.2.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gops_logo.png
